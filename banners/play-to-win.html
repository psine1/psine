<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Play to Win</title>
	<style>
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
		body { font-family: Arial, sans-serif; background: #7646df; color: #fff; }
		.ad { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; }
		.noise { position: absolute; inset: 0; opacity: .18; background: radial-gradient(circle at 20% 20%, #fff 0 2px, transparent 3px); background-size: 22px 22px; transform: rotate(-8deg) scale(1.2); }
		.copy { position: absolute; inset: 8%; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; }
		.eyebrow { margin: 0 0 auto; font-size: clamp(8px, 3.4vmin, 12px); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
		h1 { margin: 0; font-size: clamp(30px, 16vmin, 66px); line-height: .8; letter-spacing: -.06em; text-transform: uppercase; }
		p { margin: .6em 0 0; font-size: clamp(9px, 3.4vmin, 13px); font-weight: 700; }
		.target { position: absolute; z-index: 4; width: min(22vmin, 62px); aspect-ratio: 1; right: 10%; top: 18%; border: 4px solid #111; border-radius: 50%; background: #ffcf25; cursor: pointer; box-shadow: 6px 6px 0 #111; animation: float 1.4s ease-in-out infinite alternate; }
		.target::before, .target::after { content: ""; position: absolute; background: #111; }
		.target::before { width: 48%; height: 5px; left: 26%; top: calc(50% - 2px); }
		.target::after { height: 48%; width: 5px; top: 26%; left: calc(50% - 2px); }
		.score { position: absolute; right: 8%; bottom: 8%; z-index: 3; padding: .45em .65em; border: 2px solid #fff; border-radius: 99px; font-size: clamp(9px, 3vmin, 12px); font-weight: 700; }
		.flash { animation: flash .35s ease; }
		@keyframes float { to { transform: translate(-18px, 26px) rotate(16deg); } }
		@keyframes flash { 50% { background: #fc5ba4; transform: scale(1.1); } }
		@media (min-aspect-ratio: 3/1) {
			.copy { inset: 14% 3%; flex-direction: row; align-items: center; gap: 3%; }
			.eyebrow { margin: 0; white-space: nowrap; }
			h1 { font-size: clamp(30px, 8vh, 54px); white-space: nowrap; }
			.copy p { margin: 0 20% 0 auto; white-space: nowrap; }
			.target { width: min(54vh, 54px); right: 11%; top: 17%; }
			.score { right: 2%; bottom: 8%; }
		}
	</style>
</head>
<body>
	<div class="ad">
		<div class="noise"></div>
		<div class="copy"><span class="eyebrow">Interactive unit</span><h1>Play<br>to win</h1><p>Hit the target</p></div>
		<button class="target" type="button" aria-label="Hit the target"></button>
		<span class="score" aria-live="polite">Score: <b>0</b></span>
	</div>
	<script>
		const target = document.querySelector('.target');
		const score = document.querySelector('.score b');
		let points = 0;
		target.addEventListener('click', () => {
			points += 1;
			score.textContent = points;
			target.classList.remove('flash');
			void target.offsetWidth;
			target.classList.add('flash');
		});
	</script>
</body>
</html>
