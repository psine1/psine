<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Launch Mode</title>
	<style>
		* { box-sizing: border-box; }
		html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
		body { font-family: Arial, sans-serif; background: #ffcf25; color: #111; }
		.ad { position: relative; width: 100%; height: 100%; min-width: 0; overflow: hidden; cursor: pointer; isolation: isolate; }
		.grid { position: absolute; inset: 0; opacity: .13; background-image: linear-gradient(#111 1px, transparent 1px), linear-gradient(90deg, #111 1px, transparent 1px); background-size: 24px 24px; }
		.orbit { position: absolute; width: min(58vmin, 180px); aspect-ratio: 1; right: -8%; bottom: -24%; border: max(8px, 2.4vmin) solid #111; border-radius: 50%; animation: spin 8s linear infinite; }
		.orbit::before, .orbit::after { content: ""; position: absolute; border-radius: 50%; }
		.orbit::before { width: 28%; aspect-ratio: 1; top: -16%; left: 35%; background: #fc5ba4; border: 4px solid #111; }
		.orbit::after { inset: 24%; background: #7a45df; border: 5px solid #111; }
		.copy { position: absolute; inset: 10% 8%; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; }
		.label { margin: 0 0 auto; padding: .35em .65em; border: 2px solid #111; border-radius: 99px; font-size: clamp(8px, 3.2vmin, 12px); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; background: #fff; }
		h1 { max-width: 72%; margin: 0 0 .12em; font-size: clamp(28px, 16vmin, 64px); line-height: .78; letter-spacing: -.07em; text-transform: uppercase; }
		.cta { padding: .55em .85em; border-radius: 99px; background: #111; color: #fff; font-size: clamp(9px, 3.6vmin, 13px); font-weight: 700; text-transform: uppercase; }
		.ad:hover .cta { background: #7a45df; }
		@keyframes spin { to { transform: rotate(360deg); } }
		@media (min-aspect-ratio: 3/1) {
			.copy { inset: 15% 3%; flex-direction: row; align-items: center; gap: 3%; }
			.label { margin: 0; white-space: nowrap; }
			h1 { max-width: none; margin: 0 auto 0 0; font-size: clamp(30px, 8vh, 54px); line-height: .8; white-space: nowrap; }
			.orbit { width: min(34vh, 150px); right: 14%; bottom: -18%; }
			.cta { white-space: nowrap; }
		}
	</style>
</head>
<body>
	<div class="ad" role="img" aria-label="Launch Mode animated campaign">
		<div class="grid"></div>
		<div class="orbit"></div>
		<div class="copy"><p class="label">New season / 2026</p><h1>Launch<br>Mode</h1><span class="cta">Explore now →</span></div>
	</div>
</body>
</html>
